# Vision Action Platform — 5개 서비스
#   django   : 회원·DRF API·화면·Admin·ORM        (브라우저 공개 8000)
#   fastapi  : YOLO Pose + Random Forest 추론     (개발 확인용 8001, /docs)
#   celery   : 작업 처리 → FastAPI 호출 → ORM 저장
#   redis    : Celery 작업 대기열
#   postgres : 영구 DB
# 서비스 사이 통신은 localhost 가 아니라 서비스 이름(postgres, redis, fastapi)을 사용합니다.

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  FASTAPI_URL: http://fastapi:8001
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django

services:
  postgres:
    image: postgres:16
    env_file: .env                      # POSTGRES_DB / USER / PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data # 컨테이너를 지워도 DB 유지 (T10)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fastapi:
    build: ./ai_service
    volumes:
      - ./ai_service/models:/app/models:ro   # joblib · json · .pt (Git 제외 파일)
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'\"ok\"' in urllib.request.urlopen('http://localhost:8001/health').read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  django:
    build: ./backend
    env_file: .env
    environment: *backend-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - media:/app/media                # 업로드·카메라 수집 영상 (celery 와 공유)
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  celery:
    build: ./backend                    # django 와 같은 코드·이미지, 실행 명령만 다름
    env_file: .env
    environment: *backend-env
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - media:/app/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fastapi: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  media:
